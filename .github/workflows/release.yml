name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
          - os: macos-latest
            platform: darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run make

      - name: List build output
        shell: bash
        run: find out -type f 2>/dev/null | head -80 || true

      - name: Verify Windows artifacts
        if: matrix.platform == 'win32'
        shell: bash
        run: |
          test -f out/make/squirrel.windows/x64/QA-Test-Scenarios-Setup.exe
          test -f out/make/zip/win32/x64/QA\ Test\ Scenarios-win32-x64-*.zip

      - name: Verify macOS artifacts
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          test -n "$(find out/make -name '*.dmg' -print -quit)"
          test -n "$(find out/make/zip/darwin/arm64 -name '*.zip' -print -quit)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.platform }}
          path: |
            out/make/squirrel.windows/**/*
            out/make/zip/**/*
            out/make/**/*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | head -50

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/**/*
